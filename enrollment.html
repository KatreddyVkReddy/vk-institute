<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment - VK's Infinite Computer Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .enrollment-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="enrollment-container">
        <h2>Enrollment Form</h2>
        <form action="enroll.php" method="POST">
            <input type="text" name="first_name" class="input-field" placeholder="First Name" required>
            <input type="text" name="last_name" class="input-field" placeholder="Last Name" required>
            <input type="email" name="email" class="input-field" placeholder="Email" required>
            <input type="text" name="phone_number" class="input-field" placeholder="Phone Number" required>

            <input type="text" name="institute_name" class="input-field" placeholder="Institute Name" required>
            <input type="text" name="location" class="input-field" placeholder="Location" required>

            <input type="text" name="course_name" class="input-field" placeholder="Course Name" required>
            <input type="text" name="course_duration" class="input-field" placeholder="Course Duration" required>

            <input type="number" step="0.01" name="admission_fees" class="input-field" placeholder="Admission Fees" required>
            <input type="number" step="0.01" name="course_fees" class="input-field" placeholder="Course Fees" required>

            <button type="submit" class="submit-btn">Enroll Now</button>
        </form>
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

</body>
</html>
